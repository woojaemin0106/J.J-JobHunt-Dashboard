name: AI Review

on:
  pull_request:
    branches:
      - dev
    types: [opened, reopened, synchronize, ready_for_review]
  issue_comment:
    types: [created]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: ai-review-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  auto-pr-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Generate diff
        continue-on-error: true
        shell: bash
        run: |
          git diff --no-color --unified=0 \
            "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}" \
            > pr.diff

      - name: Build AI review report
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          PR_DIFF_PATH: pr.diff
          AI_REVIEW_OUTPUT_PATH: ai-review-report.md
        run: node .github/scripts/ai-review.mjs

      - name: Ensure fallback report exists
        if: always()
        shell: bash
        run: |
          if [ ! -f ai-review-report.md ]; then
            {
              echo "## AI Review Report (Skipped)"
              echo
              echo "- Status: skipped"
              echo "- Reason: workflow fallback executed (report was not generated)"
              echo "- Quality gates (\`lint\`, \`unit/integration\`, \`build\`, \`e2e-smoke\`) remain required."
            } > ai-review-report.md
          fi

      - name: Post PR comment
        if: always()
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const body = fs.readFileSync("ai-review-report.md", "utf8");
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body
            });

  manual-pr-review:
    if: |
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '/ai-review')
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Resolve PR metadata
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const pull_number = context.payload.issue.number;
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number
            });
            core.setOutput("number", String(pr.number));
            core.setOutput("head_sha", pr.head.sha);
            core.setOutput("head_ref", pr.head.ref);
            core.setOutput("base_sha", pr.base.sha);

      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.head_sha }}
          fetch-depth: 0

      - name: Generate diff
        continue-on-error: true
        shell: bash
        run: |
          git diff --no-color --unified=0 \
            "${{ steps.pr.outputs.base_sha }}...${{ steps.pr.outputs.head_sha }}" \
            > pr.diff

      - name: Build AI review report
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          PR_DIFF_PATH: pr.diff
          AI_REVIEW_OUTPUT_PATH: ai-review-report.md
        run: node .github/scripts/ai-review.mjs

      - name: Ensure fallback report exists
        if: always()
        shell: bash
        run: |
          if [ ! -f ai-review-report.md ]; then
            {
              echo "## AI Review Report (Skipped)"
              echo
              echo "- Status: skipped"
              echo "- Reason: workflow fallback executed (report was not generated)"
              echo "- Quality gates (\`lint\`, \`unit/integration\`, \`build\`, \`e2e-smoke\`) remain required."
            } > ai-review-report.md
          fi

      - name: Post PR comment
        if: always()
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const body = fs.readFileSync("ai-review-report.md", "utf8");
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number("${{ steps.pr.outputs.number }}"),
              body
            });
